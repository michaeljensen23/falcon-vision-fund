<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { margin: 0; background: #2a2a2a; }
    .row { display: flex; gap: 18px; padding: 18px; align-items: flex-end; flex-wrap: wrap; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #bbb; font: 11px/1 sans-serif; }
    .s16 { width: 16px; height: 16px; image-rendering: auto; }
    .s32 { width: 32px; height: 32px; }
    .s64 { width: 64px; height: 64px; }
    .onwhite { background: #f7f1e4; padding: 8px; }
  </style>
</head>
<body>
<div class="row">

<!-- G: angular profile, no eye, big beak -->
<div class="cell">
  <svg class="s64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <rect width="32" height="32" rx="6" fill="#0B1520"/>
    <path fill="#C4A05A" d="M6.5 19 L9 9.5 L17 6.5 L22.5 10 L29.5 12.2 L23.5 14.2 L26.2 17.8 L20.5 15.2 L18 22 L10.5 23.2 Z"/>
  </svg>
  <span>G angular</span>
</div>

<!-- H: smoother profile, no eye, bigger beak -->
<div class="cell">
  <svg class="s64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <rect width="32" height="32" rx="6" fill="#0B1520"/>

</div>

  <svg class="s64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <rect width="32" height="32" rx="6" fill="#0B1520"/>

</div>

  <svg class="s64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <rect width="32" height="32" rx="6" fill="#0B1520"/>

  </svg>

</div>

<!-- K: diving falcon chevron, bolder -->
<div class="cell">
  <svg class="s64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <rect width="32" height="32" rx="6" fill="#0B1520"/>

</div>

<div class="cell">
  <svg class="s64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
