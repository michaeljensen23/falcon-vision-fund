<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { margin: 0; background: #444; }
    .row { display: flex; gap: 24px; padding: 20px; align-items: flex-end; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #ddd; font: 12px sans-serif; }
    canvas, img, svg { display: block; }
  </style>
</head>
<body>
<div class="row" id="row"></div>
<script>
const variants = {
  g2: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="6" fill="#0B1520"/>
    <path fill="#C4A05A" d="M5.8 18.6 8.6 8.4 18.2 6.2 23 10.4 30.2 12.6 22.8 15 25.6 19.2 19.8 16 16.6 24.2 8.4 24.6 Z"/>
    <circle cx="16.4" cy="13.2" r="2.4" fill="#0B1520"/>
  </svg>`,
  k: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="6" fill="#0B1520"/>
    <path fill="#C4A05A" d="M16 5.2 27.4 23.2h-6.2L16 14.4 10.8 23.2H4.6Z"/>
  </svg>`,
  j: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="6" fill="#0B1520"/>
    <path fill="#C4A05A" d="M10 7h13.2v3.4H14.6v3.4h7.2v3.2h-7.2V25H10V7z"/>
  </svg>`,
  peakF: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="6" fill="#0B1520"/>
    <path fill="#C4A05A" d="M16 4.6 28 24.6 H21.2 L16 14.8 10.8 24.6 H4 Z"/>
  </svg>`,
  g2noeye: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="6" fill="#0B1520"/>
    <path fill="#C4A05A" d="M5.8 18.6 8.6 8.4 18.2 6.2 23 10.4 30.2 12.6 22.8 15 25.6 19.2 19.8 16 16.6 24.2 8.4 24.6 Z"/>
  </svg>`,
};

const row = document.getElementById('row');
for (const [name, svg] of Object.entries(variants)) {
  const wrap = document.createElement('div');
  wrap.className = 'cell';
  wrap.innerHTML = svg.replace('<svg', '<svg width="64" height="64"') + `<span>${name} 64</span>`;
  // 16px true pixels, then nearest-neighbor scale to 64
  const img = new Image();
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    const c16 = document.createElement('canvas');
    c16.width = 16; c16.height = 16;
    const x = c16.getContext('2d');
    x.imageSmoothingEnabled = false;
    x.drawImage(img, 0, 0, 16, 16);
    const c64 = document.createElement('canvas');
    c64.width = 64; c64.height = 64;
    const y = c64.getContext('2d');
    y.imageSmoothingEnabled = false;
    y.drawImage(c16, 0, 0, 64, 64);
    wrap.appendChild(c64);
    const lab = document.createElement('span');
    lab.textContent = name + ' 16px NN';
    wrap.appendChild(lab);
  };
  img.src = url;
  row.appendChild(wrap);
}
</script>
</body>
</html>
